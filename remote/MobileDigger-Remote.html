<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MobileDigger Remote</title>
<style>
/* Layout: one narrow control column — status strip, now-playing, five big keys, key legend. */
:root {
  --bg: #f3f5f4; --panel: #ffffff; --fg: #17201c; --muted: #5d6b64; --line: #d6dfda;
  --accent: #1f9d6b; --like: #1f9d6b; --dislike: #d2453b; --warn: #b7791f;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0f1412; --panel: #18201c; --fg: #e6eeea; --muted: #93a39b; --line: #2a3530;
          --accent: #3ccf93; --like: #3ccf93; --dislike: #ff6b5f; --warn: #e3a64a; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 var(--sans); }
main { max-width: 560px; margin: 0 auto; padding: 28px max(16px, env(safe-area-inset-left, 0px)) 40px; display: grid; gap: 16px; }
h1 { margin: 0; font-size: 20px; letter-spacing: .2px; display: flex; align-items: center; gap: 10px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.on { background: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 25%, transparent); }
.dot.wait { background: var(--warn); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; }
.status { color: var(--muted); font-size: 13px; }
.np-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); }
.np { font-size: 18px; font-weight: 600; min-height: 1.45em; overflow-wrap: anywhere; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
button { font: inherit; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--fg);
         padding: 10px 14px; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
button:disabled { opacity: .45; cursor: default; }
.keys { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.key { display: grid; gap: 4px; justify-items: center; padding: 14px 6px; }
.key b { font-size: 15px; }
.key kbd { font: 12px var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
.key.like b { color: var(--like); } .key.dislike b { color: var(--dislike); }
.key.flash { background: color-mix(in srgb, var(--accent) 18%, var(--panel)); }
.key.like.flash { background: color-mix(in srgb, var(--like) 22%, var(--panel)); }
.key.dislike.flash { background: color-mix(in srgb, var(--dislike) 22%, var(--panel)); }
input { font: 20px var(--mono); letter-spacing: 4px; width: 9.5ch; padding: 8px 10px; border-radius: 10px;
        border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
.err { color: var(--dislike); font-size: 13px; }
.hint { color: var(--muted); font-size: 13px; }
@media (max-width: 460px) { .keys { grid-template-columns: repeat(3, 1fr); } }
@media (prefers-reduced-motion: no-preference) { .key { transition: background .15s; } }
</style>
</head>
<body>
<main>
  <h1><span id="dot" class="dot"></span>MobileDigger Remote</h1>

  <section class="panel" id="connectPanel">
    <div class="status" id="status">Not connected. On the phone: menu → Desk remote → switch it on.</div>
    <div class="row">
      <button class="primary" id="connectBtn">Connect to phone</button>
      <button id="disconnectBtn" hidden>Disconnect</button>
    </div>
    <div class="row" id="pinRow" hidden>
      <label for="pin">PIN shown on the phone</label>
      <input id="pin" inputmode="numeric" autocomplete="off" maxlength="7" placeholder="000000">
      <button id="pinBtn">Unlock</button>
    </div>
    <div class="err" id="err" hidden></div>
  </section>

  <section class="panel">
    <div class="np-label">Now playing</div>
    <div class="np" id="np">—</div>
    <div class="keys">
      <button class="key" data-cmd="prev" disabled><b>Previous</b><kbd>←</kbd></button>
      <button class="key" data-cmd="play" disabled><b>Play/Pause</b><kbd>Space</kbd></button>
      <button class="key" data-cmd="next" disabled><b>Next</b><kbd>→</kbd></button>
      <button class="key like" data-cmd="like" disabled><b>Like</b><kbd>L</kbd></button>
      <button class="key dislike" data-cmd="dislike" disabled><b>Dislike</b><kbd>D</kbd></button>
    </div>
    <div class="hint">Keys work while this tab is in front. Bluetooth only: nothing goes over the internet.</div>
  </section>
</main>

<script>
const SVC = '8b7c0001-3f2a-4c1e-9d5b-6d6f62696c65';
const CMD = '8b7c0002-3f2a-4c1e-9d5b-6d6f62696c65';
const ST  = '8b7c0003-3f2a-4c1e-9d5b-6d6f62696c65';
const $ = id => document.getElementById(id);
let device = null, cmdChar = null, unlocked = false, queue = Promise.resolve(), lastPin = '';

function setStatus(text, state) {
  $('status').textContent = text;
  $('dot').className = 'dot' + (state === 'on' ? ' on' : state === 'wait' ? ' wait' : '');
}
function showErr(text) { $('err').textContent = text || ''; $('err').hidden = !text; }
function setUnlocked(v) {
  unlocked = v;
  document.querySelectorAll('.key').forEach(b => b.disabled = !v);
  $('pinRow').hidden = v || !cmdChar;
}

// One GATT write at a time (Chrome rejects overlapping operations).
function send(text) {
  if (!cmdChar) return Promise.resolve();
  queue = queue.then(() => cmdChar.writeValueWithResponse(new TextEncoder().encode(text)))
               .catch(e => showErr('Couldn’t send: ' + e.message));
  return queue;
}

function onMessage(ev) {
  const msg = new TextDecoder().decode(ev.target.value);
  if (msg === 'ok:pin') { setUnlocked(true); showErr(''); setStatus('Connected to ' + (device?.name || 'phone') + '. Use the keys below.', 'on'); }
  else if (msg === 'err:pin') { setUnlocked(false); showErr('Wrong PIN. Check the number on the phone (it changes each time the remote is switched on).'); $('pin').select(); }
  else if (msg === 'err:locked') { setUnlocked(false); showErr('Type the PIN shown on the phone first.'); }
  else if (msg.startsWith('np:')) { $('np').textContent = msg.slice(3) || '—'; }
  else if (msg.startsWith('ok:')) { flash(msg.slice(3)); }
}

function flash(cmd) {
  const b = document.querySelector('.key[data-cmd="' + cmd + '"]');
  if (!b) return;
  b.classList.add('flash');
  setTimeout(() => b.classList.remove('flash'), 220);
}

async function attach() {
  setStatus('Connecting to ' + (device.name || 'phone') + '…', 'wait');
  const server = await device.gatt.connect();
  const svc = await server.getPrimaryService(SVC);
  cmdChar = await svc.getCharacteristic(CMD);
  const st = await svc.getCharacteristic(ST);
  st.addEventListener('characteristicvaluechanged', onMessage);
  await st.startNotifications();
  $('disconnectBtn').hidden = false;
  if (lastPin) { send('pin:' + lastPin); setStatus('Unlocking…', 'wait'); }
  else { setUnlocked(false); setStatus('Connected. Type the PIN shown on the phone.', 'wait'); $('pin').focus(); }
}

async function connect() {
  showErr('');
  if (!navigator.bluetooth) {
    showErr('This browser can’t use Bluetooth here. Use Chrome or Edge on Windows/macOS, and open this file directly (or from an https:// address).');
    return;
  }
  try {
    device = await navigator.bluetooth.requestDevice({ filters: [{ services: [SVC] }] });
    device.addEventListener('gattserverdisconnected', onDisconnected);
    await attach();
  } catch (e) {
    if (e.name === 'NotFoundError') setStatus('No phone picked. Is Desk remote switched on, and the phone nearby?', '');
    else showErr(e.name === 'SecurityError'
      ? 'Bluetooth is blocked for this page (browser or company policy). Try opening the file from an https:// address.'
      : 'Couldn’t connect: ' + e.message);
  }
}

let retrying = false;
async function onDisconnected() {
  cmdChar = null; setUnlocked(false); $('pinRow').hidden = true;
  setStatus('Connection lost. Reconnecting…', 'wait');
  if (retrying || !device) return;
  retrying = true;
  for (let i = 0; i < 5 && device; i++) {
    try { await attach(); retrying = false; return; } catch (_) { await new Promise(r => setTimeout(r, 2000 * (i + 1))); }
  }
  retrying = false;
  setStatus('Disconnected. Is Desk remote still on? Click Connect to try again.', '');
  $('disconnectBtn').hidden = true;
}

function disconnect() {
  const d = device; device = null; cmdChar = null; setUnlocked(false);
  $('pinRow').hidden = true; $('disconnectBtn').hidden = true;
  if (d?.gatt?.connected) d.gatt.disconnect();
  setStatus('Disconnected.', '');
}

$('connectBtn').addEventListener('click', connect);
$('disconnectBtn').addEventListener('click', disconnect);
$('pinBtn').addEventListener('click', () => {
  lastPin = $('pin').value.replace(/\D/g, '');
  if (lastPin.length !== 6) { showErr('The PIN has 6 digits.'); return; }
  send('pin:' + lastPin);
});
$('pin').addEventListener('keydown', e => { if (e.key === 'Enter') $('pinBtn').click(); });
document.querySelectorAll('.key').forEach(b => b.addEventListener('click', () => send(b.dataset.cmd)));

const KEYS = { ArrowRight: 'next', ArrowLeft: 'prev', ' ': 'play', l: 'like', L: 'like', d: 'dislike', D: 'dislike', n: 'next', p: 'prev' };
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
  const cmd = KEYS[e.key];
  if (!cmd || !unlocked) return;
  e.preventDefault();
  send(cmd);
});
</script>
</body>
</html>
